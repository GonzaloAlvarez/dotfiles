schema: 1
name: llm.qwen.local
description: >
  qwen-code CLI pointed at a localllm llama.cpp server — same machine by
  default (127.0.0.1), or a remote server via --set server_host=<ip|name>.
  Requires gear com/qwen on PATH first: run `qwen --version` once so gear
  lazy-installs it. The server side is the separate bundle localllm.server.
automatic: false

tags:
  - development
  - llm
  - qwen
  - local

depends_on:
  - default

platforms:
  os: [darwin, linux]

requires:
  commands:
    - qwen

variables:
  server_host:
    type: string
    default: 127.0.0.1
  port:
    type: string
    default: "8080"
  model_alias:
    type: string
    default: qwen3.8-27b-local
  ctx:
    type: string
    default: "65536"
  temp:
    type: string
    default: "0.6"
  top_p:
    type: string
    default: "0.95"
  top_k:
    type: string
    default: "20"

targets:
  - id: qwen.settings.local
    operation: json_merge
    source: bundles/llm.qwen.local/files/qwen-settings.json.j2
    destination: ~/.qwen/settings.json
    template: jinja2
    owns: [/modelProviders, /primaryModel, /model, /security]

  - id: qwen.env
    operation: copy
    source: bundles/llm.qwen.local/files/qwen.env
    destination: ~/.qwen/.env
    mode: "0600"
    validate: [utf8, nonempty]
