schema: 1
name: localllm.server
description: >
  Server-side configuration for gear com/localllm (llama-server model,
  flags, and bind address). Requires gear com/localllm on PATH first: run
  `localllm --version` once so gear lazy-installs it. Bind 127.0.0.1 serves
  this machine only; --set bind=0.0.0.0 serves remote clients (see the
  client bundle llm.qwen.local and its server_host variable). Setting
  model2_alias (or model3_alias) switches the wrapper to llama-server ROUTER
  mode: up to three model ids from one process — slot 1's GGUF under another
  alias with different options when model2_file/model3_file is empty, or
  their own GGUF. Per-alias llama-server options go in model_args /
  model2_args / model3_args as space-separated key=value tokens (long flag
  names, no dashes). model*_mmproj_file names a vision projector GGUF from
  the slot's repo (pulled and served with --mmproj). On Linux the bundle also
  installs a systemd --user unit; enable it by hand with
  `systemctl --user enable --now localllm` (+ `sudo loginctl enable-linger`).
automatic: false

tags:
  - development
  - llm
  - local

depends_on:
  - default

# linux since gear com/localllm 1.3.0 (setup-debian / setup-linux).
platforms:
  os: [darwin, linux]

requires:
  commands:
    - localllm

variables:
  model_hf_repo:
    type: string
    default: unsloth/Qwen3.8-27B-GGUF
  model_file:
    type: string
    default: Qwen3.8-27B-UD-Q6_K.gguf
  # Unsloth "Dynamic 3.1" re-cut of 2026-11-10/11 (same file name, new digest;
  # the August UD3.0 file was c9c206812fbe…cd436). `localllm pull` keeps a file
  # that is already present: to upgrade a box, move the old GGUF aside, set
  # this digest (or re-install the bundle), pull, then restart `localllm serve`.
  model_sha256:
    type: string
    default: 6cac55f876015d6d4b94b1656d23f79f424ac9b583652aedf0633dba116576a8
  model_alias:
    type: string
    default: qwen3.8-27b-local
  bind:
    type: string
    default: 127.0.0.1
  port:
    type: string
    default: "8080"
  ctx:
    type: string
    default: "65536"
  # llama-server -ngl: "all" offloads everything (Metal, Vulkan); "0" keeps a
  # Linux box on the CPU backend when the benchmark says so.
  ngl:
    type: string
    default: all
  kv_quant:
    type: string
    default: q8_0
  # Speculative decoding (llama-server --spec-type). "none" disables. Only
  # enable per machine/model after benchmarking: draft-mtp needs MTP tensors
  # in the GGUF, wins big on code-like output, and LOSES on free-form prose.
  spec_type:
    type: string
    default: none
  # Router mode (see description). Empty model2_alias = classic single-model
  # serving; model2_file empty = same GGUF as model_file under the second alias.
  model2_hf_repo:
    type: string
    default: ""
  model2_file:
    type: string
    default: ""
  model2_sha256:
    type: string
    default: ""
  model2_alias:
    type: string
    default: ""
  # e.g. 'chat-template-kwargs={"enable_thinking":false} temp=0.7 top-p=0.8'
  # — no spaces inside a token, no single quotes (the config is sourced by bash).
  model_args:
    type: string
    default: ""
  model2_args:
    type: string
    default: ""
  # Slot 3 (router mode; only pulled/served when model3_alias is set), e.g.
  # Inkling 2 Mini next to the two Qwen aliases on klaus. Put spec-type=none
  # in model3_args when the box runs spec_type=draft-mtp and this model has
  # no MTP head.
  model3_hf_repo:
    type: string
    default: ""
  model3_file:
    type: string
    default: ""
  model3_sha256:
    type: string
    default: ""
  model3_alias:
    type: string
    default: ""
  model3_args:
    type: string
    default: ""
  # Optional vision projector per slot (file name in that slot's HF repo +
  # its sha256); empty = text only (single mode passes --no-mmproj).
  model_mmproj_file:
    type: string
    default: ""
  model_mmproj_sha256:
    type: string
    default: ""
  model2_mmproj_file:
    type: string
    default: ""
  model2_mmproj_sha256:
    type: string
    default: ""
  model3_mmproj_file:
    type: string
    default: ""
  model3_mmproj_sha256:
    type: string
    default: ""
  # Space-separated NAME=VALUE pairs exported before llama-server starts,
  # e.g. GGML_VK_PREFER_HOST_MEMORY=1 on an AMD APU running Vulkan.
  server_env:
    type: string
    default: ""
  # llama-server --sleep-idle-seconds (-1 = never unload the model).
  sleep_idle:
    type: string
    default: "-1"
  # Router mode only: models resident at once.
  models_max:
    type: string
    default: "1"

targets:
  - id: localllm.config
    operation: copy
    source: bundles/localllm.server/files/localllm-config.j2
    destination: ~/.config/localllm/config
    template: jinja2
    validate: [utf8, nonempty]

  # Headless Linux servers run `localllm serve` as a user service; macOS keeps
  # the on-demand `tmux new -s llm 'localllm serve'` (no LaunchAgent by design).
  - id: localllm.service
    operation: copy
    source: bundles/localllm.server/files/localllm.service
    destination: ~/.config/systemd/user/localllm.service
    when:
      os: [linux]
    validate: [utf8, nonempty]
