schema: 1
name: localllm.server
description: >
  Server-side configuration for gear com/localllm (llama-server model,
  flags, and bind address). Requires gear com/localllm on PATH first: run
  `localllm --version` once so gear lazy-installs it. Bind 127.0.0.1 serves
  this machine only; --set bind=0.0.0.0 serves remote clients (see the
  client bundle llm.qwen.local and its server_host variable). Setting
  model2_alias switches the wrapper to llama-server ROUTER mode: two model
  ids from one process — the same GGUF under both aliases with different
  per-alias options when model2_file is empty, or a second GGUF. Per-alias
  llama-server options go in model_args / model2_args as space-separated
  key=value tokens (long flag names, no dashes). On Linux the bundle also
  installs a systemd --user unit; enable it by hand with
  `systemctl --user enable --now localllm` (+ `sudo loginctl enable-linger`).
automatic: false

tags:
  - development
  - llm
  - local

depends_on:
  - default

# linux since gear com/localllm 1.3.0 (setup-debian / setup-linux).
platforms:
  os: [darwin, linux]

requires:
  commands:
    - localllm

variables:
  model_hf_repo:
    type: string
    default: unsloth/Qwen3.8-27B-GGUF
  model_file:
    type: string
    default: Qwen3.8-27B-UD-Q6_K.gguf
  model_sha256:
    type: string
    default: c9c206812fbe4ac7b76a729e25928b63f2ae89d37f69da7a71c20aec763cd436
  model_alias:
    type: string
    default: qwen3.8-27b-local
  bind:
    type: string
    default: 127.0.0.1
  port:
    type: string
    default: "8080"
  ctx:
    type: string
    default: "65536"
  # llama-server -ngl: "all" offloads everything (Metal, Vulkan); "0" keeps a
  # Linux box on the CPU backend when the benchmark says so.
  ngl:
    type: string
    default: all
  kv_quant:
    type: string
    default: q8_0
  # Speculative decoding (llama-server --spec-type). "none" disables. Only
  # enable per machine/model after benchmarking: draft-mtp needs MTP tensors
  # in the GGUF, wins big on code-like output, and LOSES on free-form prose.
  spec_type:
    type: string
    default: none
  # Router mode (see description). Empty model2_alias = classic single-model
  # serving; model2_file empty = same GGUF as model_file under the second alias.
  model2_hf_repo:
    type: string
    default: ""
  model2_file:
    type: string
    default: ""
  model2_sha256:
    type: string
    default: ""
  model2_alias:
    type: string
    default: ""
  # e.g. 'chat-template-kwargs={"enable_thinking":false} temp=0.7 top-p=0.8'
  # — no spaces inside a token, no single quotes (the config is sourced by bash).
  model_args:
    type: string
    default: ""
  model2_args:
    type: string
    default: ""
  # Space-separated NAME=VALUE pairs exported before llama-server starts,
  # e.g. GGML_VK_PREFER_HOST_MEMORY=1 on an AMD APU running Vulkan.
  server_env:
    type: string
    default: ""
  # llama-server --sleep-idle-seconds (-1 = never unload the model).
  sleep_idle:
    type: string
    default: "-1"
  # Router mode only: models resident at once.
  models_max:
    type: string
    default: "1"

targets:
  - id: localllm.config
    operation: copy
    source: bundles/localllm.server/files/localllm-config.j2
    destination: ~/.config/localllm/config
    template: jinja2
    validate: [utf8, nonempty]

  # Headless Linux servers run `localllm serve` as a user service; macOS keeps
  # the on-demand `tmux new -s llm 'localllm serve'` (no LaunchAgent by design).
  - id: localllm.service
    operation: copy
    source: bundles/localllm.server/files/localllm.service
    destination: ~/.config/systemd/user/localllm.service
    when:
      os: [linux]
    validate: [utf8, nonempty]
